<html lang="ko">
<head>

<title>현실 시뮬레이터</title>

<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#17202e;--sub:#6b7686;--line:#dde2ea;--up:#e5383b;--down:#2563eb;--acc:#17202e;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#18202b;--ink:#e8edf4;--sub:#8b97a8;--line:#2a3442;--up:#ff6b6e;--down:#6ea0ff;--acc:#e8edf4;--accink:#0f141b}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#18202b;--ink:#e8edf4;--sub:#8b97a8;--line:#2a3442;--up:#ff6b6e;--down:#6ea0ff;--acc:#e8edf4;--accink:#0f141b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.total{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;gap:18px;color:var(--sub);font-size:14px;flex-wrap:wrap;margin-top:4px}
.up{color:var(--up)}.down{color:var(--down)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.ctl button,.ctl span{white-space:nowrap}
.ctl button{padding:6px 10px}
@media(max-width:700px){.top{display:block}.ctl{margin-top:10px}.ctl .who{flex:1 1 100%;margin:4px 0 0}#logout{margin-left:0}}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
button:focus-visible{outline:2px solid var(--down);outline-offset:2px}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.total{font-size:28px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.list button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 14px;text-align:left;background:none}
.list button:last-child{border-bottom:0}
.list button.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--acc)}
.list small{display:block;color:var(--sub)}
.r{text-align:right}
.main{padding:14px}
.main h2{margin:0;font-size:18px}
svg{width:100%;height:190px;display:block;margin:8px 0}
.trade{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trade .b{background:var(--up);color:#fff;border-color:var(--up)}
.trade .s{background:var(--down);color:#fff;border-color:var(--down)}
.news{font-size:14px;color:var(--sub);min-height:22px;margin:8px 0 0}
.scroll{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:400}
tr:last-child td{border-bottom:0}
.empty{padding:14px;color:var(--sub);font-size:14px}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--down)}
.vert{flex-direction:column;align-items:stretch}
.reels{display:flex;gap:8px;justify-content:center;background:#3a2a1a;padding:12px;border-radius:12px;margin:12px 0}
.reel{width:80px;height:90px;background:#fff;border-radius:8px;font-size:48px;display:flex;align-items:center;justify-content:center}
.reel.sp{filter:blur(2px)}
.cd{display:inline-block;background:#fff;color:#111;border:1px solid #999;border-radius:6px;padding:6px 8px;margin:2px;font-weight:700;min-width:40px;text-align:center}
.cd.r{color:#d22}.cd.back{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 4px,#1e4fc4 4px,#1e4fc4 8px);color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
.authbg{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;background:var(--bg);color:var(--ink)}
.authbg .ttl{font-size:clamp(28px,8vw,40px);font-weight:800;text-align:center;line-height:1.15}
.authbg .ttl small{display:block;margin-top:6px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:3px}
.authbox{box-sizing:border-box;width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.authbox .row{display:flex;flex-direction:column;gap:10px}
.authbox .fields{display:flex;flex-direction:column;gap:8px}
.authbox input[type=text],.authbox input[type=password]{box-sizing:border-box;width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.authbox input:focus{outline:none;border-color:var(--acc)}
.authbox .main{box-sizing:border-box;width:100%;font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:1px solid var(--acc);border-radius:8px;cursor:pointer;padding:10px}
.authbox label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.authbox .sub{box-sizing:border-box;font:inherit;font-size:14px;width:100%;padding:8px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.authbox .msg:empty{display:none}
.authbox .msg{margin:0;font-size:12px;color:var(--up);font-weight:700}
.authbox .link{align-self:center;background:none;border:none;color:var(--sub);font:inherit;font-size:11px;opacity:.75;cursor:pointer;padding:2px 6px;text-decoration:underline}
.authbox h3{margin:0;font-size:16px}
.logbg{position:fixed;inset:0;z-index:90;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}.lgw{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}.lgh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.lgh h2{margin:0;font-size:20px}.lgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.lgs>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}.lgs b{font-size:14px}.lgs small{color:var(--sub);font-size:11px}.lgw h3{margin:16px 0 4px;font-size:15px}.gl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.gl small{color:var(--sub)}.gl>b{white-space:nowrap}
.who{font-size:13px;color:var(--sub);margin-right:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;border:4px dashed rgba(255,255,255,.85);font-weight:700;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.chip:active{transform:translateY(2px)}
.chip.sel{transform:translateY(-4px);box-shadow:0 0 0 3px #f4d58d}
.mc{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px dashed #fff;margin-right:-4px}
.areas{display:flex;gap:8px;margin-top:10px}
.area{flex:1;min-height:130px;background:rgba(255,255,255,.1);border:2px solid #f4d58d;color:#fff;border-radius:10px;padding:8px 4px;text-align:center;font-size:13px}
.area b{display:block;font-size:15px}.area small{display:inline;opacity:.8;font-size:12px;font-weight:400}.area div{min-height:20px}
.area:disabled{opacity:1;cursor:default}
.area.win{border-color:#ffd54a;box-shadow:0 0 16px #ffd54a}
.fly{display:inline-block;animation:fin .9s ease-out}
@keyframes fin{from{transform:translateY(-130px);opacity:0}to{transform:none;opacity:1}}
.sweep{animation:swp .9s ease-in .6s forwards}
@keyframes swp{to{transform:translateY(-130px);opacity:0}}
.ban{text-align:center;background:rgba(0,0,0,.55);border-radius:12px;padding:8px;margin:8px 0}
.ban b{display:block;font-size:24px}.ban span{display:block;font-size:20px;color:#ffd54a;font-weight:700}
.cdn{text-align:center;margin-top:8px;font-size:14px}
.sb{display:flex;gap:14px;font-size:14px;margin-top:12px;flex-wrap:wrap}
.bead{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,18px);grid-auto-columns:18px;gap:3px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.bd{width:18px;height:18px;border-radius:50%;font-size:10px;font-style:normal;color:#fff;display:flex;align-items:center;justify-content:center}
.bd.p{background:#2563eb}.bd.b{background:#e63946}.bd.t{background:#16a34a}
.fchip{position:fixed;z-index:50;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;border:4px dashed rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.st{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.st th,.st td{text-align:center;padding:5px;border:1px solid var(--line);font-weight:600}
.st td.p{color:#2563eb}.st td.b{color:#e63946}.st td.t{color:#16a34a}
.bd.e{background:transparent;border:1px solid var(--line)}
.bacwrap{display:flex;gap:12px;align-items:flex-start}.bacwrap .felt{flex:1;min-width:0}.side{width:210px;flex:none}
@media(max-width:700px){.bacwrap{flex-direction:column;align-items:stretch}.side{width:100%}}
.st td:first-child{text-align:left}
.felt{background:#0b6b3a;border-radius:14px;padding:20px;min-height:430px;color:#fff;border:4px solid #3a2a1a}
.dl{font-size:58px;display:flex;align-items:center;gap:10px}
.dl span{font-size:14px;background:#fff;color:#111;border-radius:10px;padding:6px 10px}
.lane{display:flex;align-items:center;gap:10px;margin-top:8px;min-height:110px;font-size:14px}
.lane .lb{width:58px;font-weight:700}.lane .cds{flex:1}
.big{font-size:28px;font-weight:700;min-width:36px;text-align:center;color:#ffd54a}
.fc{display:inline-block;width:60px;height:84px;perspective:400px;margin:3px}
.fc i{display:block;position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.f i{transform:rotateY(180deg)}
.fc u{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;border:1px solid #999;font-size:20px}
.fc .bk{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 4px,#1e4fc4 4px,#1e4fc4 8px)}
.fc .fr{background:#fff;color:#111;transform:rotateY(180deg)}.fc .fr.r{color:#d22}

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>현실 시뮬레이터</h1>
      <div class="total" id="total"></div>
      <div class="row" id="sum"></div>
    </div>
    <div class="ctl">
      <button id="pause">일시정지</button>
      <span>속도</span>
      <button data-sp="1000">1x</button><button data-sp="500">2x</button><button data-sp="200">5x</button>
      <button id="reset">처음부터</button>
      <span class="who" id="who"></span><button id="logout">로그아웃</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="stock">📈 주식</button><button data-tab="work">🔨 노가다</button><button data-tab="gamble">🎰 도박장</button>
  </div>
  <div class="grid" id="gs">
    <div class="panel list" id="list"></div>
    <div class="panel main">
      <h2 id="name"></h2>
      <div id="price"></div>
      <svg id="chart" viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="가격 차트"></svg>
      <div class="trade">
        <button class="b" data-buy="1">매수 1주</button>
        <button class="b" data-buy="10">매수 10주</button>
        <button class="b" data-buy="max">최대 매수</button>
        <button class="s" data-sell="1">매도 1주</button>
        <button class="s" data-sell="all">전량 매도</button>
      </div>
      <p class="news" id="news"></p>
    </div>
  </div>
  <div class="panel main" id="alt" hidden></div>
  <div class="panel scroll" id="hold"></div>
</div>
<div class="authbg" id="auth" hidden>
  <div class="ttl">🎲 현실 시뮬레이터<small>REALITY SIMULATOR</small></div>
  <div class="authbox" id="v-login">
    <div class="row">
      <div class="fields">
        <input id="au-n" type="text" placeholder="닉네임" maxlength="12" autocomplete="username">
        <input id="au-p" type="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <button class="main" id="au-go">로그인</button>
    </div>
    <label><input type="checkbox" id="au-save" checked> ID 저장</label>
    <button class="sub" id="au-guest">게스트로 플레이 (저장 안 됨)</button>
    <p class="msg" id="au-msg"></p>
    <button class="link" id="au-up">회원가입</button>
  </div>
  <div class="authbox" id="v-signup" hidden>
    <h3>회원가입</h3>
    <input id="sg-n" type="text" placeholder="닉네임 (1~12자)" maxlength="12" autocomplete="username">
    <input id="sg-p" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="new-password">
    <input id="sg-p2" type="password" placeholder="비밀번호 확인" autocomplete="new-password">
    <button class="main" id="sg-go">가입하기</button>
    <p class="msg" id="sg-msg"></p>
    <button class="link" id="sg-back">← 로그인으로 돌아가기</button>
  </div>
</div>
<div class="logbg" id="logv" hidden></div>

  pt=tot(p);kt=tot(k);const w=pt>kt?"p":kt>pt?"b":"t",wn={p:"플레이어",b:"뱅커",t:"타이"}[w];
  const pay=w==="t"?bb.t*9+bb.p+bb.b:w==="p"?bb.p*2:Math.floor(bb.b*1.95),net=pay-b;
  say(w==="t"?`타이! (${pt} : ${kt})`:`${wn} 승! (${pt} : ${kt})`);
  if(b>0){res(pay,b);logAdd("🎴 바카라",[["p","플레이어"],["b","뱅커"],["t","타이"]].filter(([k])=>bb[k]).map(([k,n])=>n+" "+won(bb[k])).join(" · "),`${wn}${w==="t"?"":" 승"} (${pt} : ${kt})`,net,b)}else gres="";
  head();$("ar-"+w).classList.add("win");
  for(const k of["p","b","t"])if(bb[k]>0){
    const cs=$("ar-"+k).querySelector(".cs");if(!cs)continue;
    if(k===w)cs.insertAdjacentHTML("beforeend",`<span class="fly">${stack(k==="p"?bb.p:k==="b"?Math.floor(bb.b*.95):bb.t*8)}</span>`);
    else if(w!=="t")cs.classList.add("sweep");
  }
  bt.insertAdjacentHTML("beforeend",`<div class="ban"><b>${b===0?wn+" 승":net>0?"🎉 승리!":net<0?"패배":"무승부"}</b>${b>0?`<span>${net>0?"+":""}${won(net)}</span>`:""}</div>`);
  await sleep(3200);
  const bn=bt.querySelector(".ban");if(bn)bn.remove();say("다음 판 베팅을 받습니다");
  bacHTML=bt.innerHTML;lastBb={...bb};bb={p:0,b:0,t:0,j:0};bh=[];bacBusy=false;ct=BET_SEC;renderTab();
}
function showLog(){
  const v=document.getElementById("logv"),n=glog.length,sg=x=>(x>0?"+":"")+won(x);
  const tb=glog.reduce((a,x)=>a+(x.b||0),0),net=glog.reduce((a,x)=>a+x.n,0),w=glog.filter(x=>x.n>0).length,l=glog.filter(x=>x.n<0).length,by={};
  glog.forEach(x=>{const o=by[x.g]=by[x.g]||{c:0,n:0,b:0};o.c++;o.n+=x.n;o.b+=x.b||0});
  v.innerHTML=`<div class="lgw"><div class="lgh"><h2>📒 도박 기록</h2><button data-a="logclose">닫기</button></div>
<div class="lgs"><div><small>총 판 수</small><b>${n}판</b><small>${w}승 ${l}패 ${n-w-l}무</small></div><div><small>총 배팅액</small><b>${won(tb)}</b></div><div><small>총 손익</small><b class="${cls(net)}">${sg(net)}</b></div></div>
${Object.entries(by).map(([g,o])=>`<div class="gl"><div><b>${g}</b> <small>${o.c}판 · 배팅 ${won(o.b)}</small></div><b class="${cls(o.n)}">${sg(o.n)}</b></div>`).join("")}
<h3>전체 기록 (최신순)</h3>
${n?glog.map(x=>`<div class="gl"><div><b>${x.g}</b> <small>${x.d}</small><br><small>${x.r}</small></div><b class="${cls(x.n)}">${sg(x.n)}</b></div>`).join(""):'<p class="news">아직 기록이 없어요. 도박을 하면 여기에 쌓여요.</p>'}
${n?'<button data-a="logclr" style="margin-top:12px">기록 지우기</button>':""}</div>`;
  v.hidden=false;v.scrollTop=0;
}
function act(a){
  if(a==="spin")return spin();
  if(a==="bacdeal")return bac();
  if(a==="bjdeal")return bjPlay();
  if(a==="hit"||a==="stand"||a==="dbl"){if(bjRes){const f=bjRes;bjRes=null;f(a)}return}
  if(a==="logopen")return showLog();
  if(a==="logclose"){document.getElementById("logv").hidden=true;return}
  if(a==="logclr"){glog=[];save();return showLog()}
  if(a==="bacundo"){const x=bh.pop();if(x)bb[x[0]]-=x[1];return render()}
  if(a==="bacclr"){bb={p:0,b:0,t:0,j:0};bh=[];return render()}
  if(a==="bacre"){
    if(lastBb&&lastBb.p+lastBb.b+lastBb.t+lastBb.j<=cash){bb={...lastBb};if(game==="bj")bb.p=bb.b=bb.t=0;else bb.j=0;bh=Object.entries(bb).filter(e=>e[1]);gres=""}else gres="같은 배팅을 할 칩이 부족해요.";
    return render();
  }
}
function buy(k){const s=S[sel],p=cur(s),m=Math.floor(cash/p),n=k==="max"?m:Math.min(+k,m);if(n<1){news="현금이 부족합니다.";render();return}cash-=n*p;s.q+=n;s.cost+=n*p;news=`${s.n} ${n}주를 ${won(p)}에 매수했습니다.`;render()}
function sell(k){const s=S[sel],p=cur(s),n=k==="all"?s.q:Math.min(+k,s.q);if(n<1){news="보유 수량이 없습니다.";render();return}const avg=s.cost/s.q;cash+=n*p;s.q-=n;s.cost=s.q?avg*s.q:0;news=`${s.n} ${n}주를 ${won(p)}에 매도했습니다.`;render()}
function run(){clearInterval(timer);if(!paused)timer=setInterval(tick,speed);document.querySelectorAll("[data-sp]").forEach(b=>b.classList.toggle("on",+b.dataset.sp===speed));pause.textContent=paused?"재개":"일시정지";pause.classList.toggle("on",paused)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.i!==undefined){sel=+t.dataset.i;render()}
  else if(t.dataset.buy)buy(t.dataset.buy);
  else if(t.dataset.sell)sell(t.dataset.sell);
  else if(t.dataset.sp){speed=+t.dataset.sp;run()}
  else if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.job)work(+t.dataset.job);
  else if(t.id==="rest")rest();
  else if(t.dataset.chip){bet=Math.min(cash,bet+(+t.dataset.chip));render()}
  else if(t.dataset.bet){bet=t.dataset.bet==="all"?cash:0;render()}
  else if(t.dataset.g){game=t.dataset.g;gres="";bb={p:0,b:0,t:0,j:0};bh=[];render()}
  else if(t.dataset.cs){chipSel=t.dataset.cs==="all"?"all":+t.dataset.cs;render()}
  else if(t.dataset.area){const k=t.dataset.area;if(bacBusy||bjBusy)return;const amt=chipSel==="all"?cash-bsum():chipSel;if(amt<1||bsum()+amt>cash){gres="칩이 부족해요.";render();return}bb[k]+=amt;bh.push([k,amt]);gres=chipSel==="all"?`올인! 남은 돈 ${won(amt)}을 올렸어요.`:"";fly(k,()=>{chipSnd();render()})}
  else if(t.dataset.a)act(t.dataset.a);
  else if(t.id==="pause"){paused=!paused;run()}
  else if(t.id==="reset"){if(!rc){rc=1;t.textContent="정말? 한 번 더";setTimeout(()=>{rc=0;t.textContent="처음부터"},3000);return}rc=0;t.textContent="처음부터";init();paused=false;run();render()}
  else if(t.id==="logout")logoutBtn()
  else if(t.id==="au-go")authGo()
  else if(t.id==="sg-go")signupGo()
  else if(t.id==="au-up")authView(true)
  else if(t.id==="sg-back")authView(false)
  else if(t.id==="au-guest")guestGo()
});

/* ===== 계정 / 자동 저장 (이 브라우저의 localStorage에 저장) ===== */
let user=null;
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const users=()=>{try{return JSON.parse(LS.get("hs:users")||"{}")}catch(e){return{}}};
async function hashPw(n,p){
  const str="hs|"+n+"|"+p;
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=5381;for(const c of str)h=((h<<5)+h+c.charCodeAt(0))|0;return "x"+h;
}
let cloud=null,cIn=false,cPend=false,cLast="",cLastCash=null,cTimer=0,cLastT=0,rc=0;
const stateBody=()=>JSON.stringify({S,cash,sel,sta,gnet,glog,cnt,hist,lastBb,tab,game,chipSel,speed,news});
function cloudSave(){
  const body=stateBody();
  if(body===cLast)return;
  const now=Date.now(),urgent=cash!==cLastCash;
  if(!urgent&&now-cLastT<5000){if(!cTimer)cTimer=setTimeout(()=>{cTimer=0;cloudSave()},5050-(now-cLastT));return}
  if(cIn){cPend=true;return}
  cIn=true;cLast=body;cLastCash=cash;cLastT=now;
  cloud.set({json:body,t:now}).catch(()=>{cLast=""}).finally(()=>{cIn=false;if(cPend){cPend=false;cloudSave()}});
}
function flush(){if(cloud){cLastT=0;cloudSave()}else save()}
async function cloudInit(){
  try{
    const [db,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!u)return false;
    const id=await u.id();if(!id)return false;
    const ref=db.doc("data/users/"+id+"/save"),snap=await ref.get();
    let ok=false;
    if(snap.exists){try{applySave(JSON.parse(snap.data().json));ok=true}catch(e){}}
    if(!ok)init();
    cloud=ref;return true;
  }catch(e){return false}
}
function save(){
  if(cloud){cloudSave();return}
  if(!user)return;
  LS.set("hs:save:"+user,JSON.stringify({S,cash,sel,sta,gnet,glog,cnt,hist,lastBb,tab,game,chipSel,speed,news}));
}
function applySave(d){
  if(!d||!Array.isArray(d.S)||d.S.length!==BASE.length||typeof d.cash!=="number"||!isFinite(d.cash))throw 0;
  S=d.S;cash=d.cash;sel=Math.min(Math.max(d.sel|0,0),S.length-1);sta=d.sta;gnet=d.gnet||0;glog=Array.isArray(d.glog)?d.glog:[];
  cnt=d.cnt||{p:0,b:0,t:0,j:0};hist=d.hist||[];lastBb=d.lastBb||null;
  tab=d.tab||"stock";game=d.game||"slot";chipSel=d.chipSel||10000;speed=d.speed||1000;news=d.news||"";
  bb={p:0,b:0,t:0,j:0};bh=[];bacHTML="";bjHTML="";jbHTML="";gres="";wres="";spinning=false;
}
function setWho(){
  document.getElementById("who").textContent=cloud?"☁️ 클라우드 자동 저장":user?"👤 "+user:"👤 게스트 · 저장 안 됨";
  document.getElementById("logout").hidden=!!cloud;
  document.getElementById("logout").textContent=user?"로그아웃":"로그인";
}
function showAuth(){
  clearInterval(timer);
  document.getElementById("au-msg").textContent="";
  document.getElementById("au-p").value="";
  document.getElementById("v-login").hidden=false;document.getElementById("v-signup").hidden=true;
  {const id=LS.get("hs:lastid");if(id){document.getElementById("au-n").value=id}}
  document.getElementById("auth").hidden=false;
  setTimeout(()=>document.getElementById("au-n").focus(),0);
}
function enterUser(n){
  user=n;LS.set("hs:cur",n);
  let ok=false;const raw=LS.get("hs:save:"+n);
  if(raw){try{applySave(JSON.parse(raw));ok=true}catch(e){}}
  if(!ok)init();
  document.getElementById("auth").hidden=true;
  document.getElementById("au-p").value="";
  setWho();paused=false;run();render();save();
}
async function authGo(){
  const n=document.getElementById("au-n").value.trim(),p=document.getElementById("au-p").value,m=document.getElementById("au-msg");
  if(!n||!p){m.textContent="닉네임과 비밀번호를 입력해 주세요.";return}
  const U=users();
  if(!Object.prototype.hasOwnProperty.call(U,n)){m.textContent="없는 닉네임이에요. 아래에서 회원가입을 해주세요.";return}
  if(U[n]!==await hashPw(n,p)){m.textContent="비밀번호가 틀렸어요.";return}
  if(document.getElementById("au-save").checked)LS.set("hs:lastid",n);else LS.del("hs:lastid");
  enterUser(n);
}
async function signupGo(){
  const n=document.getElementById("sg-n").value.trim(),p=document.getElementById("sg-p").value,p2=document.getElementById("sg-p2").value,m=document.getElementById("sg-msg");
  if(!n||n.length>12){m.textContent="닉네임은 1~12자로 입력해 주세요.";return}
  if(p.length<4){m.textContent="비밀번호는 4자 이상이어야 해요.";return}
  if(p!==p2){m.textContent="비밀번호 확인이 달라요.";return}
  const U=users();
  if(Object.prototype.hasOwnProperty.call(U,n)){m.textContent="이미 있는 닉네임이에요.";return}
  U[n]=await hashPw(n,p);
  if(!LS.set("hs:users",JSON.stringify(U))){m.textContent="이 브라우저는 저장이 막혀 있어요. 게스트로 플레이해 주세요.";return}
  LS.set("hs:lastid",n);
  enterUser(n);
}
function authView(signup){
  document.getElementById("v-login").hidden=signup;
  document.getElementById("v-signup").hidden=!signup;
  ["au-msg","sg-msg"].forEach(i=>document.getElementById(i).textContent="");
  document.getElementById(signup?"sg-n":"au-n").focus();
}
function guestGo(){
  user=null;LS.del("hs:cur");
  document.getElementById("auth").hidden=true;
  setWho();paused=false;run();render();
}
function logoutBtn(){
  if(bjBusy||bacBusy){gres="한 판이 끝난 뒤에 로그아웃할 수 있어요.";render();return}
  if(user){save();user=null;LS.del("hs:cur");init()}
  setWho();render();showAuth();
}
document.getElementById("au-n").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("au-p").focus()});
document.getElementById("au-p").addEventListener("keydown",e=>{if(e.key==="Enter")authGo()});
document.getElementById("sg-n").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("sg-p").focus()});
document.getElementById("sg-p").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("sg-p2").focus()});
document.getElementById("sg-p2").addEventListener("keydown",e=>{if(e.key==="Enter")signupGo()});
addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
init();render();setWho();
const localFlow=()=>{run();const c=LS.get("hs:cur");if(c&&Object.prototype.hasOwnProperty.call(users(),c))enterUser(c);else showAuth()};
if(window.claude&&claude.use){
  document.getElementById("who").textContent="☁️ 불러오는 중…";
  cloudInit().then(ok=>{
    if(ok){document.getElementById("auth").hidden=true;setWho();paused=false;run();render();cloudSave()}
    else{setWho();localFlow()}
  }).catch(()=>{setWho();localFlow()});
}else localFlow();
</script>
